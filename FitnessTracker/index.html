<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fitness Tracker</title>
<meta name="description" content="Suivi de musculation : programme, séances, historique et progression.">
<meta name="theme-color" content="#14171A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one phone-width column, content scrolls, tab bar pinned below. Dark first, orange as the single accent. */
:root{
  --bg:#14171A;--surf:#1D2227;--surf2:#262C31;--line:#2E353B;
  --fg:#E8EAEC;--mute:#A9B0B6;--acc:#FF8A4C;--acc-ink:#1B0F07;
  --good:#6BCB8B;--bad:#F2796A;--veil:rgba(5,7,9,.62);
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4F5;--surf:#FFFFFF;--surf2:#ECEEF0;--line:#D8DCDF;
    --fg:#15191C;--mute:#566067;--acc:#C2410C;--acc-ink:#FFFFFF;
    --good:#1B7F45;--bad:#B3321F;--veil:rgba(20,24,28,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F5;--surf:#FFFFFF;--surf2:#ECEEF0;--line:#D8DCDF;
  --fg:#15191C;--mute:#566067;--acc:#C2410C;--acc-ink:#FFFFFF;
  --good:#1B7F45;--bad:#B3321F;--veil:rgba(20,24,28,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14171A;--surf:#1D2227;--surf2:#262C31;--line:#2E353B;
  --fg:#E8EAEC;--mute:#A9B0B6;--acc:#FF8A4C;--acc-ink:#1B0F07;
  --good:#6BCB8B;--bad:#F2796A;--veil:rgba(5,7,9,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.num{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* headings */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 0 16px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{margin:2px 0 0;font:700 40px/1 var(--disp);text-transform:uppercase;text-wrap:balance}
h2{margin:0;font:700 26px/1.05 var(--disp);text-transform:uppercase;text-wrap:balance}
h3{margin:0;font:700 22px/1.1 var(--disp);text-transform:uppercase}
.shd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 10px}
.shd h2{font-size:22px}
.mute{color:var(--mute)}
.small{font-size:14px}
.sync{font-size:12px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px;padding-bottom:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--good)}
.sync.err i{background:var(--bad)}

/* cards and lists */
.card{background:var(--surf);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin-top:2px}
.xl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.xl:first-child{border-top:0}
.xl .t{font-weight:500;min-width:0}
.xl .v{font:700 19px/1 var(--disp);color:var(--acc);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);border-radius:14px;padding:14px 16px;min-height:60px}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .main b{font:700 22px/1.05 var(--disp);text-transform:uppercase}
.item .main span{font-size:14px;color:var(--mute)}
.item .side{font:700 20px/1 var(--disp);color:var(--acc);white-space:nowrap}
.date{flex:none;width:52px;text-align:center;font-family:var(--disp);text-transform:uppercase}
.date b{display:block;font-size:30px;line-height:1;font-weight:700}
.date span{font-size:14px;color:var(--mute);font-weight:600;letter-spacing:.06em}
.month{margin:22px 0 8px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.empty{background:var(--surf);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--mute)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:17px;width:100%}
.btn.soft{background:var(--surf2);color:var(--fg)}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.s{min-height:44px;width:auto;font-size:16px;padding:0 16px}
.ibtn{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ibtn:active,.btn:active,.item:active{opacity:.75}
.ibtn.bad{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tab bar and top bar */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:11.5px;min-width:0;font-weight:600;color:var(--mute)}
.nav button[aria-current="page"]{color:var(--acc)}
.top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.top .ttl{min-width:0;display:flex;flex-direction:column}
.top .ttl b{font:700 24px/1 var(--disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:13px;color:var(--mute)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--surf);min-width:0;border:1px solid transparent}
.wd.today{border-color:var(--acc)}
.wd small{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.wd b{font:700 15px/1 var(--disp);color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wd b.off{color:var(--mute);font-weight:600}
.wd .ok{height:16px;color:var(--good)}

/* logger */
.ex{background:var(--surf);border-radius:16px;padding:14px 14px 10px;margin-bottom:14px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-h p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.tools{display:flex;flex:none;margin:-6px -6px 0 0}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) 76px 64px 48px;gap:8px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:12px;transition:background .2s}
.srow.done{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.srow.next{background:color-mix(in srgb,var(--fg) 6%,transparent);box-shadow:inset 3px 0 0 var(--acc)}
.srow.next .sn:not(.t-w):not(.t-d):not(.t-f){color:var(--acc)}
.srow.head,.srow.head:hover{background:none;box-shadow:none}
.srow.head svg{display:block;margin:0 auto}
.srow.head{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:10px}
.srow.head span{text-align:center}
.sn{text-align:center;font:700 18px var(--disp);color:var(--mute)}
button.sn{min-height:40px;width:100%;padding:0;border-radius:10px;background:var(--surf2)}
button.sn.t-w{background:#F5C51833;color:#F5C518}
button.sn.t-d{background:#4C8DF633;color:#6BA3FF}
button.sn.t-f{background:#E5484D33;color:#FF6A6F}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;margin-top:6px;border-radius:999px;background:var(--surf2);color:var(--mute);font-size:13px;font-weight:600}
.ex-h p.sug{color:var(--acc);font-weight:600}
.modal{max-height:90%;overflow-y:auto}
.modal .stats div{background:var(--surf2)}
.gnav+.week .wd b.num{font-size:16px}
.empty-h{margin:10px 0 0}
.crown{color:#F5C518;display:inline-flex;vertical-align:-2px;margin-left:6px}
.crown svg{fill:currentColor;stroke:currentColor;stroke-width:1.2}
.snw{position:relative;display:block}
.snw .crown{position:absolute;top:-9px;right:-7px;margin:0;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.4))}
.sum-l{display:flex;align-items:baseline;gap:10px}
.sum-l b{font:700 26px var(--disp);color:var(--acc);min-width:64px;white-space:nowrap}
.sum-l span{color:var(--mute);font-size:15px}
.sum-pr h3{margin:4px 0 2px;font:700 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sum-pr small{color:var(--acc);font-weight:700;margin-left:6px}
.pv{font-size:14px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surf2);text-align:center;font:700 21px var(--disp);padding:0 4px;min-width:0}
.in.t{text-align:left;font:500 16px var(--body);padding:0 12px}
.chk{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);color:var(--mute);opacity:.85;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .12s}
.chk:active{transform:scale(.92)}
.srow.next .chk{border-color:var(--acc);color:var(--acc);opacity:1}
.srow.done .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);opacity:1}
.srow.done .in{border-color:var(--acc)}
.sbar{display:flex;gap:8px;padding-top:8px}
.sbar .btn{min-height:44px;font-size:15px;flex:1;min-width:0;padding:0 8px}
.note{padding-top:8px}
.rest{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surf2);border-top:1px solid var(--line)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{display:block}
.rg-bg{fill:none;stroke:var(--line);stroke-width:5}
.rg-f{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--disp);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.rg-f{transition:stroke-dashoffset 1s linear}}
.rest span{flex:1;font-size:14px;color:var(--mute)}

/* sheets */
.ov{position:absolute;inset:0;background:var(--veil);display:flex;align-items:flex-end;z-index:5}
.ov.mid{align-items:center;padding:24px}
.sheet{background:var(--surf);width:100%;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 8px 18px}
.sheet-b{overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:8px}
.modal{background:var(--surf);width:100%;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal p{margin:0;color:var(--mute)}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surf2);font-weight:500}
.pk.new{color:var(--acc);font-weight:600}
.pk small{color:var(--mute);font-size:13px}

/* design 2-7 */
.item .main b.xn{text-transform:none;font:700 21px/1.15 var(--disp);letter-spacing:.01em}
.ex h3{text-transform:none;font:700 23px/1.15 var(--disp);letter-spacing:.01em}
.expb{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:0 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);text-align:left;font-weight:600;font-size:16px}
.expb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expb small{color:var(--mute);font-size:13px;font-weight:500}
.expb .ic{color:var(--mute)}
.expb .mdot{margin-right:0}
.pk.sel{outline:2px solid var(--acc);outline-offset:-2px}
.pk.sel .ic{color:var(--acc)}
.item .main .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.item .main .mcs{display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0}
.item .main .mc{display:inline-flex;align-items:center;font-size:13px;color:var(--mute);white-space:nowrap}
.item .main .mc .mdot{width:8px;height:8px;margin-right:6px}
.item .main .vol{font:700 17px/1 var(--disp);color:var(--fg);white-space:nowrap;flex:none}
.nav button{gap:2px}
.ni{display:flex;padding:3px 18px;border-radius:999px;transition:background .2s,color .2s}
.nav{position:relative;isolation:isolate}
.nav-ind{position:absolute;left:0;top:0;z-index:-1;border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,transparent);pointer-events:none}
/* design */
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;flex:none;position:relative;top:-1px}
.ex-h h3 .mdot{width:12px;height:12px;margin-right:9px}
.card.cmp{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.card.cmp .eyebrow{margin:0}
.cmp-t{margin:3px 0 0;font:600 17px/1.3 var(--body)}
.card.cmp .btn{width:auto;flex:none;padding:0 16px}
.cal-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;margin-top:26px;padding:0 16px;border-radius:14px;background:var(--surf);color:var(--fg)}
.cal-sum b{font:700 22px var(--disp);text-transform:uppercase}
.cal-sum small{font-size:14px;color:var(--mute)}
.cal-sum .ic{color:var(--mute)}
@media (prefers-reduced-motion:no-preference){
 @keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
 .chk.pop{animation:pop .3s ease-out}
 @keyframes crownin{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.4) rotate(8deg);opacity:1}100%{transform:none}}
 .crown.pop{animation:crownin .55s cubic-bezier(.2,.9,.3,1.2)}
 @keyframes chdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
 @keyframes chfade{from{opacity:0}}
 .ch-draw .ch-line{stroke-dasharray:1;animation:chdraw .75s ease-out}
 .ch-draw .ch-area{animation:chfade .9s ease-out}
 .ch-draw .ch-pt,.ch-draw .ch-best,.ch-draw .ch-sel,.ch-draw .ch-cr{animation:chfade .9s ease-out}
}
.seg .tgl{display:inline-flex;align-items:center;gap:6px}
/* picker categories */
.pkseg{margin:2px 0 4px}
.cat{display:flex;flex-direction:column;gap:6px}
.cat-h span{flex:1;font-weight:600}
.cat-h .ic{color:var(--mute);transition:transform .2s}
.cat-h[aria-expanded="true"] .ic{transform:rotate(90deg)}
.cat-t{margin:10px 0 0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.catb{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--line);margin-bottom:6px}
.prow{display:flex;align-items:center;gap:4px}
.prow .pk{flex:1;min-width:0}
.prow .pk span{overflow:hidden;text-overflow:ellipsis}
.newx{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
/* muscles */
.mu-list{display:flex;flex-direction:column;margin-top:8px}
.mu-r{display:grid;grid-template-columns:104px minmax(0,1fr) 38px 30px;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border-top:1px solid var(--line)}
.mu-n{font-weight:600;font-size:14px;white-space:nowrap}
.mu-r.z0 .mu-n,.mu-r.z0 b{color:var(--mute);font-weight:500}
.mu-bar{position:relative;height:12px;border-radius:6px;background:var(--surf2);overflow:hidden}
.mu-z{position:absolute;top:0;bottom:0;background:var(--mute);opacity:.28}
.mu-f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.mu-r b{text-align:right;font-size:16px}
.mu-d{font-size:12px;text-align:right}
.mu-x{padding:0 0 8px 12px}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fld .in.t{height:48px}
select.in{text-align:left;font:500 16px var(--body);padding:0 10px;height:44px;appearance:none;background-image:none}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.drow b{font:700 20px var(--disp);text-transform:uppercase}
.stp{display:flex;align-items:center;gap:4px}
.stp b{min-width:28px;text-align:center;font:700 22px var(--disp)}
.titem{background:var(--surf);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.titem .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* chart */
.cardc{background:var(--surf);border-radius:16px;padding:14px 10px 10px}
.read{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 8px 6px}
.read b{font:700 40px/1 var(--disp);color:var(--acc)}
.read span{font-size:14px;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--mute);font:500 11px var(--body)}
.ch-line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:url(#chg)}
.ch-cr path{fill:#F5C518;stroke:#F5C518;stroke-width:1.4;stroke-linejoin:round}
.ch-pt{fill:var(--surf);stroke:var(--acc);stroke-width:2}
.ch-best{fill:var(--acc);stroke:var(--acc);stroke-opacity:.3;stroke-width:7}
.ch-sel{fill:var(--acc);stroke:var(--surf);stroke-width:3}
.ch-guide{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--surf);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stats b{font:700 24px/1.1 var(--disp)}
.up{color:var(--good)}.dn{color:var(--bad)}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--bg);vertical-align:middle}
.dot.ring{background:transparent;border:2px solid var(--acc)}
.wd .dots,.cd .dots{display:flex;gap:3px;height:10px;align-items:center}

/* ---------- sauvegarde Google Drive (dossier caché de l'app) ---------- */
var GCID='758884703149-6rpnm1smstbv81lc202gqam8or7u349h.apps.googleusercontent.com',GK='ft.gdrive',GFILE='fitness-tracker-backup.json';
var gSt=(function(){try{return JSON.parse(localStorage.getItem(GK)||'{}')||{}}catch(e){return {}}})();
var gTok=null,gExp=0,gBusy=false,gNeed=false,gClient=null,gErr='',gCb=null,gEb=null,gPers=null;
function gSave(){try{localStorage.setItem(GK,JSON.stringify(gSt))}catch(e){}}
function gOn(){return !!(gSt.on&&GCID&&GCID.indexOf('__')!==0)}
function gAgo(t){var m=Math.round((Date.now()-t)/60000);if(m<1)return 'à l\'instant';if(m<60)return 'il y a '+m+' min';var h=Math.round(m/60);if(h<24)return 'il y a '+h+' h';return 'il y a '+Math.round(h/24)+' j'}
function gRefresh(){
 ui.sync=gOn()?(gErr?'err':'ok'):'local';
 setSync(ui.sync);
 if(ui.modal||(ui.route.name==='main'&&ui.tab==='set'))render();
}
var _syncText=syncText;
syncText=function(){if(gOn()){if(gBusy)return 'Sauvegarde…';if(gErr)return 'Drive : '+gErr;return 'Drive · '+(gSt.last?gAgo(gSt.last):'en attente')}return _syncText()};
var _saveLocal=saveLocal;
saveLocal=function(){_saveLocal();gNeed=true};
var _commit=commit;
function gCool(){return !!(gSt.fail&&Date.now()-gSt.fail<6048e5)}
try{if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(function(v){gPers=v?1:0;if(ui.tab==='set'&&ui.route.name==='main')render()})}catch(e){}

function gLoad(cb){
 if(window.google&&google.accounts&&google.accounts.oauth2)return cb(true);
 var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
 sc.onload=function(){cb(!!(window.google&&google.accounts&&google.accounts.oauth2))};sc.onerror=function(){cb(false)};
 document.head.appendChild(sc);
}
function gToken(prompt){
 return new Promise(function(res,rej){
  if(gTok&&Date.now()<gExp-60000)return res(gTok);
  gLoad(function(ok){
   if(!ok)return rej({error:'offline'});
   if(!gClient)gClient=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'https://www.googleapis.com/auth/drive.appdata',
    callback:function(r){if(gCb)gCb(r)},error_callback:function(e){if(gEb)gEb(e)}});
   gCb=function(r){if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;res(gTok)}else rej(r||{error:'denied'})};
   gEb=function(e){rej(e||{error:'popup'})};
   try{gClient.requestAccessToken({prompt:prompt})}catch(e){rej(e)}
  });
 });
}
function gApi(url,init){
 init=init||{};init.headers=Object.assign({Authorization:'Bearer '+gTok},init.headers||{});
 return fetch(url,init).then(function(r){if(r.status===401)gTok=null;if(!r.ok)throw {error:'http'+r.status};return r});
}
function gFind(){
 return gApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='"+GFILE+"'")+'&fields=files(id,modifiedTime)')
  .then(function(r){return r.json()}).then(function(j){return (j.files||[])[0]||null});
}
function gRead(id){return gApi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media').then(function(r){return r.json()})}
function gPayload(){return JSON.stringify({app:'fitness-tracker',v:1,at:Date.now(),S:S,SESS:SESS})}
function gWrite(id,body){
 if(id)return gApi('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body}).then(function(r){return r.json()});
 var bd='ftb'+uid(),meta=JSON.stringify({name:GFILE,parents:['appDataFolder']});
 return gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
  body:'--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--'}).then(function(r){return r.json()});
}
function gDone(j){gSt.mod=j.modifiedTime;gSt.last=Date.now();gSt.hold=false;gSt.fail=0;gSave();gNeed=false;gBusy=false;gErr='';gRefresh()}
function gAsk(r,f,why){
 var n=(r&&r.SESS&&r.SESS.length)||0;
 gSt.hold=true;gSave();
 if(ui.modal&&ui.modal.title==='Séance terminée'){ui.gwait=[r,f,why];gRefresh();return}
 ui.gpend={r:r,f:f};
 ui.modal={title:'Sauvegarde Drive trouvée',text:'Drive contient '+n+' séance'+(n>1?'s':'')+', enregistrée'+(n>1?'s':'')+' le '+new Date(f.modifiedTime).toLocaleDateString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'. Ce téléphone en contient '+SESS.length+'. '+(why==='manual'?'':'Choisis quelle version garder.'),
  btns:[{act:'gRestore',label:'Restaurer depuis Drive'},{act:'gOverwrite',label:'Écraser Drive avec ce téléphone',soft:true},{act:'closeModal',label:'Annuler',line:true}]};

}

function gRun(interactive){
 if(gBusy||!GCID||GCID.indexOf('__')===0)return Promise.resolve();
 gBusy=true;gErr='';gRefresh();
 return gToken(interactive?'':'none').then(function(){
  if(interactive){gSt.on=true;gSave()}
  return gFind();
 }).then(function(f){
  if(f&&(!gSt.mod||f.modifiedTime!==gSt.mod)){
   return gRead(f.id).then(function(r){gBusy=false;gAsk(r,f,'');return 'ask'});
  }
  return gWrite(f&&f.id,gPayload()).then(function(j){gDone(j);return 'ok'});
 }).catch(function(e){
  gBusy=false;gErr=e&&e.error==='offline'?'hors ligne':'à reconnecter';if(!interactive&&!(e&&e.error==='offline')){gSt.fail=Date.now();gSave()}gRefresh();return 'err';
 });
}
function gPull(){
 if(gBusy)return;gBusy=true;gErr='';gRefresh();
 gToken('').then(function(){gSt.on=true;gSave();return gFind()}).then(function(f){
  gBusy=false;if(!f){gRefresh();toast('Aucune sauvegarde sur Drive');return}
  return gRead(f.id).then(function(r){gAsk(r,f,'manual')});
 }).catch(function(e){gBusy=false;gErr=e&&e.error==='offline'?'hors ligne':'à reconnecter';gRefresh()});
}

}
setTimeout(gBoot,1500);

function gUI(){
 if(!GCID||GCID.indexOf('__')===0)return '';
 var pers='<p class="mute small" style="margin:8px 0 0">Stockage du téléphone protégé contre le nettoyage automatique : '+(gPers===1?'oui':gPers===0?'non (exporte régulièrement un fichier)':'inconnu')+'.</p>';
 if(!gOn())return '<div class="card" style="margin-top:10px"><div><b>Sauvegarde Google Drive</b><div class="mute small">Connecte ton compte Google une fois : l\'app sauvegarde ensuite toute seule dans un dossier caché de ton Drive. Rien n\'est partagé et l\'app ne voit pas le reste de ton Drive.</div></div><button class="btn" data-act="gConnect">Se connecter avec Google</button></div>'+pers;
 var st=gBusy?'Sauvegarde en cours…':gSt.hold?'⚠ Choix en attente : appuie sur « Sauvegarder maintenant ».':gErr?'⚠ '+gErr+'. Appuie sur « Sauvegarder maintenant » pour te reconnecter.':'Dernière sauvegarde : '+(gSt.last?gAgo(gSt.last):'aucune')+'. Automatique à l\'ouverture de l\'app, au plus une fois par semaine.';
 return '<div class="card" style="margin-top:10px"><div><b>Sauvegarde Google Drive</b><div class="mute small">'+st+'</div></div><div class="row2"><button class="btn soft" data-act="gNow">Sauvegarder maintenant</button><button class="btn soft" data-act="gPull">Restaurer</button></div><button class="btn line" data-act="gOff">Se déconnecter</button></div>'+pers;
}
