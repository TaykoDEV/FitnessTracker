<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fitness Tracker</title>
<meta name="description" content="Suivi de musculation : programme, séances, historique et progression.">
<meta name="theme-color" content="#14171A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one phone-width column, content scrolls, tab bar pinned below. Dark first, orange as the single accent. */
:root{
  --bg:#14171A;--surf:#1D2227;--surf2:#262C31;--line:#2E353B;
  --fg:#E8EAEC;--mute:#A9B0B6;--acc:#FF8A4C;--acc-ink:#1B0F07;
  --good:#6BCB8B;--bad:#F2796A;--veil:rgba(5,7,9,.62);
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4F5;--surf:#FFFFFF;--surf2:#ECEEF0;--line:#D8DCDF;
    --fg:#15191C;--mute:#566067;--acc:#C2410C;--acc-ink:#FFFFFF;
    --good:#1B7F45;--bad:#B3321F;--veil:rgba(20,24,28,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F5;--surf:#FFFFFF;--surf2:#ECEEF0;--line:#D8DCDF;
  --fg:#15191C;--mute:#566067;--acc:#C2410C;--acc-ink:#FFFFFF;
  --good:#1B7F45;--bad:#B3321F;--veil:rgba(20,24,28,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14171A;--surf:#1D2227;--surf2:#262C31;--line:#2E353B;
  --fg:#E8EAEC;--mute:#A9B0B6;--acc:#FF8A4C;--acc-ink:#1B0F07;
  --good:#6BCB8B;--bad:#F2796A;--veil:rgba(5,7,9,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.num{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* headings */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 0 16px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{margin:2px 0 0;font:700 40px/1 var(--disp);text-transform:uppercase;text-wrap:balance}
h2{margin:0;font:700 26px/1.05 var(--disp);text-transform:uppercase;text-wrap:balance}
h3{margin:0;font:700 22px/1.1 var(--disp);text-transform:uppercase}
.shd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 10px}
.shd h2{font-size:22px}
.mute{color:var(--mute)}
.small{font-size:14px}
.sync{font-size:12px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px;padding-bottom:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--good)}
.sync.err i{background:var(--bad)}

/* cards and lists */
.card{background:var(--surf);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin-top:2px}
.xl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.xl:first-child{border-top:0}
.xl .t{font-weight:500;min-width:0}
.xl .v{font:700 19px/1 var(--disp);color:var(--acc);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);border-radius:14px;padding:14px 16px;min-height:60px}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .main b{font:700 22px/1.05 var(--disp);text-transform:uppercase}
.item .main span{font-size:14px;color:var(--mute)}
.item .side{font:700 20px/1 var(--disp);color:var(--acc);white-space:nowrap}
.date{flex:none;width:52px;text-align:center;font-family:var(--disp);text-transform:uppercase}
.date b{display:block;font-size:30px;line-height:1;font-weight:700}
.date span{font-size:14px;color:var(--mute);font-weight:600;letter-spacing:.06em}
.month{margin:22px 0 8px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.empty{background:var(--surf);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--mute)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:17px;width:100%}
.btn.soft{background:var(--surf2);color:var(--fg)}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.s{min-height:44px;width:auto;font-size:16px;padding:0 16px}
.ibtn{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ibtn:active,.btn:active,.item:active{opacity:.75}
.ibtn.bad{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tab bar and top bar */
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:11.5px;min-width:0;font-weight:600;color:var(--mute)}
.nav button[aria-current="page"]{color:var(--acc)}
.top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.top .ttl{min-width:0;display:flex;flex-direction:column}
.top .ttl b{font:700 24px/1 var(--disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:13px;color:var(--mute)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--surf);min-width:0;border:1px solid transparent}
.wd.today{border-color:var(--acc)}
.wd small{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.wd b{font:700 15px/1 var(--disp);color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wd b.off{color:var(--mute);font-weight:600}
.wd .ok{height:16px;color:var(--good)}

/* logger */
.ex{background:var(--surf);border-radius:16px;padding:14px 14px 10px;margin-bottom:14px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-h p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.tools{display:flex;flex:none;margin:-6px -6px 0 0}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) 76px 64px 44px;gap:8px;align-items:center;padding:4px 0}
.srow.head{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:10px}
.srow.head span{text-align:center}
.sn{text-align:center;font:700 18px var(--disp);color:var(--mute)}
button.sn{min-height:40px;width:100%;padding:0;border-radius:10px;background:var(--surf2)}
button.sn.t-w{background:#F5C51833;color:#F5C518}
button.sn.t-d{background:#4C8DF633;color:#6BA3FF}
button.sn.t-f{background:#E5484D33;color:#FF6A6F}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;margin-top:6px;border-radius:999px;background:var(--surf2);color:var(--mute);font-size:13px;font-weight:600}
.ex-h p.sug{color:var(--acc);font-weight:600}
.modal{max-height:90%;overflow-y:auto}
.modal .stats div{background:var(--surf2)}
.gnav+.week .wd b.num{font-size:16px}
.empty-h{margin:10px 0 0}
.crown{color:#F5C518;display:inline-flex;vertical-align:-2px;margin-left:6px}
.crown svg{fill:currentColor;stroke:currentColor;stroke-width:1.2}
.snw{position:relative;display:block}
.snw .crown{position:absolute;top:-9px;right:-7px;margin:0;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.4))}
.sum-l{display:flex;align-items:baseline;gap:10px}
.sum-l b{font:700 26px var(--disp);color:var(--acc);min-width:64px;white-space:nowrap}
.sum-l span{color:var(--mute);font-size:15px}
.sum-pr h3{margin:4px 0 2px;font:700 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sum-pr small{color:var(--acc);font-weight:700;margin-left:6px}
.pv{font-size:14px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surf2);text-align:center;font:700 21px var(--disp);padding:0 4px;min-width:0}
.in.t{text-align:left;font:500 16px var(--body);padding:0 12px}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);color:transparent;display:flex;align-items:center;justify-content:center}
.srow.done .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.srow.done .in{border-color:var(--acc)}
.sbar{display:flex;gap:8px;padding-top:8px}
.sbar .btn{min-height:44px;font-size:15px;flex:1;min-width:0;padding:0 8px}
.note{padding-top:8px}
.rest{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surf2);border-top:1px solid var(--line)}
.rest b{font:700 30px/1 var(--disp);color:var(--acc);min-width:64px}
.rest span{flex:1;font-size:14px;color:var(--mute)}

/* sheets */
.ov{position:absolute;inset:0;background:var(--veil);display:flex;align-items:flex-end;z-index:5}
.ov.mid{align-items:center;padding:24px}
.sheet{background:var(--surf);width:100%;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 8px 18px}
.sheet-b{overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:8px}
.modal{background:var(--surf);width:100%;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal p{margin:0;color:var(--mute)}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surf2);font-weight:500}
.pk.new{color:var(--acc);font-weight:600}
.pk small{color:var(--mute);font-size:13px}

/* picker categories */
.pkseg{margin:2px 0 4px}
.cat{display:flex;flex-direction:column;gap:6px}
.cat-h span{flex:1;font-weight:600}
.cat-h .ic{color:var(--mute);transition:transform .2s}
.cat-h[aria-expanded="true"] .ic{transform:rotate(90deg)}
.cat-t{margin:10px 0 0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.catb{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--line);margin-bottom:6px}
.prow{display:flex;align-items:center;gap:4px}
.prow .pk{flex:1;min-width:0}
.prow .pk span{overflow:hidden;text-overflow:ellipsis}
.newx{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
/* muscles */
.mu-list{display:flex;flex-direction:column;margin-top:8px}
.mu-r{display:grid;grid-template-columns:82px minmax(0,1fr) 40px 32px;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border-top:1px solid var(--line)}
.mu-n{font-weight:600;font-size:14px}
.mu-r.z0 .mu-n,.mu-r.z0 b{color:var(--mute);font-weight:500}
.mu-bar{position:relative;height:12px;border-radius:6px;background:var(--surf2);overflow:hidden}
.mu-z{position:absolute;top:0;bottom:0;background:var(--mute);opacity:.28}
.mu-f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.mu-r b{text-align:right;font-size:16px}
.mu-d{font-size:12px;text-align:right}
.mu-x{padding:0 0 8px 12px}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fld .in.t{height:48px}
select.in{text-align:left;font:500 16px var(--body);padding:0 10px;height:44px;appearance:none;background-image:none}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.drow b{font:700 20px var(--disp);text-transform:uppercase}
.stp{display:flex;align-items:center;gap:4px}
.stp b{min-width:28px;text-align:center;font:700 22px var(--disp)}
.titem{background:var(--surf);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.titem .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* chart */
.cardc{background:var(--surf);border-radius:16px;padding:14px 10px 10px}
.read{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 8px 6px}
.read b{font:700 40px/1 var(--disp);color:var(--acc)}
.read span{font-size:14px;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--mute);font:500 11px var(--body)}
.ch-line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--acc);fill-opacity:.13}
.ch-pt{fill:var(--surf);stroke:var(--acc);stroke-width:2}
.ch-best{fill:var(--acc)}
.ch-sel{fill:var(--acc);stroke:var(--surf);stroke-width:3}
.ch-guide{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--surf);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stats b{font:700 24px/1.1 var(--disp)}
.up{color:var(--good)}.dn{color:var(--bad)}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--bg);vertical-align:middle}
.dot.ring{background:transparent;border:2px solid var(--acc)}
.wd .dots,.cd .dots{display:flex;gap:3px;height:10px;align-items:center}
.cal{background:var(--surf);border-radius:16px;padding:10px 8px 8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px}
.cal-h b{font:700 22px var(--disp);text-transform:uppercase}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-w{text-align:center;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);padding:4px 0}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:50px;border-radius:10px;font:500 15px var(--body);color:var(--fg);cursor:pointer}
.cd.empty{cursor:default}
.cd .n{min-width:26px;text-align:center;padding:1px 0;border-radius:999px;line-height:1.3}
.cd.today .n{background:var(--acc);color:var(--acc-ink);font-weight:700}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 6px 4px;font-size:13px;color:var(--mute)}
.leg span{display:flex;align-items:center;gap:6px}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw button,.sw label{width:40px;height:40px;border-radius:50%;border:3px solid transparent;position:relative;display:block}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.sw input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.swc{background:conic-gradient(#e5484d,#f5c518,#3fb950,#2dbfb0,#4c8df6,#ec5fa8,#e5484d)}
.gnav{display:flex;align-items:center;gap:2px}
.ibtn.sm{width:40px;height:40px}
.pill{min-height:36px;padding:0 12px;border-radius:999px;background:var(--surf2);font-weight:600;font-size:14px;color:var(--acc)}
.cal-t{font:700 22px var(--disp);text-transform:uppercase;min-height:44px;padding:0 10px}
@media (prefers-reduced-motion:no-preference){
 .sl-next{animation:slnext .2s ease-out}.sl-prev{animation:slprev .2s ease-out}
 @keyframes slnext{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
 @keyframes slprev{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
}
#toasts{position:fixed;left:16px;right:16px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:20}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:520px;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
var DS=['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var LS='carnet-de-salle.v1';
var app=document.getElementById('app');
var PAL=['#E5484D','#4C8DF6','#F5C518','#3FB950','#FF8A4C','#9B6BF2','#EC5FA8','#2DBFB0'];
var DEFC={upa:PAL[0],low:PAL[1],upb:PAL[2]};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return iso(new Date())}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function dow(d){return (d.getDay()+6)%7}
function num(v){if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))}
function fmt(n){if(!isFinite(n))return '–';var r=Math.round(n*10)/10;return String(r).replace('.',',')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dlabel(s){return pd(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return (h?h+':'+pad(m):m)+':'+pad(s)}
function e1(kg,reps){return kg*(1+reps/30)}

function parseCSV(t){

 for(var i=0;i<t.length;i++){
  var c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}

}

 if(S.active){toast('Une séance est déjà en cours');return}
 var s=SESS.find(function(x){return x.id===sid});if(!s)return;
 S.active={id:uid(),date:date||todayISO(),tplId:s.tplId||null,name:s.name,startedAt:Date.now(),
  items:s.items.map(function(it){return {id:uid(),ex:it.ex,note:'',target:'',sets:it.sets.filter(function(x){return x.t!=='w'}).map(function(x){var o={kg:fmt(x.kg),reps:String(x.reps),done:false};if(x.t)o.t=x.t;return o})}})};
 openLogger('active');
}
function toEdit(s){
 var c=clone(s);
 return {id:c.id,date:c.date,tplId:c.tplId,name:c.name,start:c.start||null,dur:c.dur||null,startedAt:c.start||null,
  items:c.items.map(function(it){return {id:uid(),ex:it.ex,note:it.note||'',target:'',sets:it.sets.map(function(x){var o={kg:fmt(x.kg),reps:String(x.reps),done:true};if(x.t)o.t=x.t;return o})}})};
}
function openLogger(kind){
 ui.curKind=kind;if(kind==='active')ui.cur=S.active;
 ui.sheet=null;ui.modal=null;ui.route={name:'logger'};
 if(kind==='active')dirtyCfg();
 render();
}
function touch(){if(ui.curKind==='active')dirtyCfg()}
function countSets(c){
 var done=0,pend=0;
 c.items.forEach(function(it){it.sets.forEach(function(x){if(!(num(x.reps)>0))return;if(x.done)done++;else pend++})});
 return {done:done,pend:pend};
}
function tryFinish(){
 var n=countSets(ui.cur);
 if(!n.done&&!n.pend){toast('Ajoute au moins une série avec des reps');return}
 if(n.pend){
  ui.modal={title:'Séries non cochées',text:n.done+' série'+(n.done>1?'s':'')+' cochée'+(n.done>1?'s':'')+', '+n.pend+' avec des valeurs mais sans coche. Que faire des autres ?',
   btns:[{act:'finishAll',label:'Tout garder'},{act:'finishDone',label:'Garder les cochées',soft:true},{act:'closeModal',label:'Continuer la séance',line:true}]};
  render();return;
 }
 commit(false);
}
function bestE1(ex,items){var b=0;items.forEach(function(it){if(it.ex===ex)it.sets.forEach(function(x){if(x.t!=='w'&&x.kg>0)b=Math.max(b,e1(x.kg,x.reps))})});return b}
function monOf(ds){var d=pd(ds);d.setDate(d.getDate()-dow(d));return iso(d)}
function streakWeeks(anchor){var m={};SESS.forEach(function(s){m[monOf(s.date)]=1});var k=monOf(anchor),n=0;while(m[k]){n++;var d=pd(k);d.setDate(d.getDate()-7);k=iso(d)}return n}
function summaryModal(rec,prs){
 var st=sstats(rec),mw=monOf(rec.date),wd=SESS.filter(function(s){return monOf(s.date)===mw}).length,goal=S.sched.filter(Boolean).length,
  sk=streakWeeks(rec.date),n=SESS.filter(function(s){return s.date<=rec.date}).length;
 var pv=rec.tplId?SESS.find(function(s){return s.id!==rec.id&&s.tplId===rec.tplId&&s.date<=rec.date}):null;
 var h='<p style="margin:-6px 0 0">Séance n°'+n+' · '+esc(rec.name)+(rec.dur?' · '+rec.dur+' min':'')+'</p>';
 h+='<div class="stats" style="margin:0"><div><span>Exercices</span><b class="num">'+rec.items.length+'</b></div><div><span>Séries</span><b class="num">'+st.sets+'</b></div><div><span>Volume</span><b class="num">'+Math.round(st.vol).toLocaleString('fr-FR')+'</b></div></div>';
 h+='<div class="sum-l"><b class="num">≈ '+kcalSess(rec)+'</b><span>kcal brûlées (estimation)</span></div>';
 h+='<div class="sum-l"><b class="num">'+(goal&&wd<=goal?wd+'/'+goal:wd)+'</b><span>séance'+(wd>1?'s':'')+' cette semaine</span></div>';
 h+='<div class="sum-l"><b class="num">'+sk+'</b><span>'+(sk>1?'semaines d\'affilée':'semaine · enchaîne la suivante')+'</span></div>';
 if(pv){var pvl=sstats(pv).vol;if(pvl>0){var pc=Math.round((st.vol/pvl-1)*100);h+='<div class="sum-l"><b class="num">'+(pc>0?'+':'')+pc+' %</b><span>de volume vs la dernière '+esc(pv.name)+'</span></div>'}}
 if(prs.length){h+='<div class="sum-pr"><h3>Records · 1RM estimé</h3>'+prs.slice(0,6).map(function(r){return '<div class="xl"><span class="t">'+esc(r.name)+'</span><span class="v num">'+fmt(r.v)+' kg<small>+'+fmt(r.v-r.old)+'</small></span></div>'}).join('')+'</div>'}
 return {title:'Séance terminée',html:h,btns:[{act:'closeModal',label:'Fermer'}]};
}
function commit(keepPending){
 var c=ui.cur,items=[];
 c.items.forEach(function(it){
  var sets=[];
  it.sets.forEach(function(x){var r=num(x.reps);if(!(r>0))return;if(!x.done&&!keepPending)return;var k=num(x.kg),o={kg:isNaN(k)?0:k,reps:r};if(x.t)o.t=x.t;sets.push(o)});
  if(sets.length)items.push({ex:it.ex,note:it.note||'',sets:sets});
 });
 if(!items.length){ui.modal=null;render();toast('Aucune série à enregistrer');return}
 var end=Date.now(),isActive=ui.curKind==='active';
 var rec={id:c.id,date:c.date,tplId:c.tplId||null,name:c.name,items:items,
  start:c.startedAt||null,dur:isActive&&c.startedAt&&c.date===todayISO()?Math.max(1,Math.round((end-c.startedAt)/60000)):(c.dur||null),upd:end};
 var prs=[];
 items.forEach(function(it){
  var old=0,had=false;
  SESS.forEach(function(s){if(s.id===rec.id)return;var b=bestE1(it.ex,s.items);if(b>0){had=true;old=Math.max(old,b)}});
  var nb=bestE1(it.ex,[it]);if(had&&nb>old+0.05)prs.push({name:exName(it.ex),v:nb,old:old});
 });
 var i=SESS.findIndex(function(s){return s.id===rec.id}),wasNew=i<0;
 if(i>=0)SESS[i]=rec;else SESS.push(rec);
 sortSess();saveLocal();pushSess(rec);
 if(isActive){S.active=null;ui.from=null;dirtyCfg()}
 ui.cur=null;ui.curKind=null;ui.rest=null;ui.route={name:'sess',id:rec.id};
 ui.modal=isActive&&wasNew?summaryModal(rec,prs):null;
 render();
 if(!ui.modal)toast(prs.length?'Record : '+prs.slice(0,2).map(function(r){return r.name}).join(', '):'Séance enregistrée');
}

 h+='<div class="shd"><h2>'+wtitle+'</h2><div class="gnav">'+(off?'<button class="pill" data-act="wkNow">Aujourd\'hui</button>':'<span class="mute small">'+wk+' séance'+(wk>1?'s':'')+'</span>')+'<button class="ibtn sm" data-act="wkPrev" aria-label="Semaine précédente">'+svg('back',20)+'</button><button class="ibtn sm" data-act="wkNext" aria-label="Semaine suivante">'+svg('chev',20)+'</button></div></div><div class="week">'+cells+'</div>';

function bwHome(now,tds){
 var di=dow(now),off=ui.bwk||0,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-di+off*7),cells='',vals=[];
 for(var i=0;i<7;i++){
  var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),ds=iso(d),e=S.bw.find(function(x){return x.d===ds});
  if(e)vals.push(e.kg);
  cells+='<button class="wd'+(ds===tds?' today':'')+'" data-act="bwOpen" data-date="'+ds+'" aria-label="Poids du '+DAYS[i].toLowerCase()+' '+d.getDate()+' '+MONTHS[d.getMonth()]+'"><small>'+DS[i]+'</small><b class="num'+(e?'':' off')+'">'+(e?fmt(e.kg):'–')+'</b></button>';
 }
 var last=S.bw.length?S.bw[S.bw.length-1]:null;
 var lab=vals.length?'moy. '+fmt(vals.reduce(function(a,b){return a+b},0)/vals.length)+' kg':(last?'dernier '+fmt(last.kg)+' kg':'aucune pesée');
 var h='<div class="shd"><h2>Poids</h2><div class="gnav">'+(off?'<button class="pill" data-act="bwNow">Aujourd\'hui</button>':'<span class="mute small">'+lab+'</span>')+'<button class="ibtn sm" data-act="bwPrev" aria-label="Semaine précédente">'+svg('back',20)+'</button><button class="ibtn sm" data-act="bwNext" aria-label="Semaine suivante">'+svg('chev',20)+'</button></div></div><div class="week" data-bw="1">'+cells+'</div>';
 if(!S.bw.length)h+='<p class="mute small" style="margin:8px 0 0">Touche un jour pour saisir ton poids. Il sert à estimer les calories.</p>';
 return h;
}

 var mx=20;rows.forEach(function(k){if(w.r[k].n>mx)mx=w.r[k].n});

  }
 });
 h+='</div><p class="mute small" style="margin:14px 0 0">La zone grisée de chaque barre (10 à 20) est le repère courant en séries par semaine et par muscle. Les échauffements ne comptent pas. Une série compte 1 pour le muscle principal et ½ pour chaque muscle secondaire : règle ces tags depuis l\'engrenage d\'un exercice (dans le sélecteur ou la séance).</p>';

function programView(){
 var h='<header class="hd"><div><p class="eyebrow">Planning et séances</p><h1>Programme</h1></div></header>';

function series(ex,metric,range){
 var out=[],lim=range==='3m'?Date.now()-92*864e5:range==='6m'?Date.now()-183*864e5:0;
 SESS.slice().reverse().forEach(function(s){
  var sets=[];s.items.forEach(function(it){if(it.ex===ex)sets=sets.concat(it.sets.filter(function(x){return x.t!=='w'}))});
  if(!sets.length)return;var d=pd(s.date);if(d.getTime()<lim)return;
  var best=null,bv=-1,mx=0,vol=0;
  sets.forEach(function(x){var v=x.kg>0?e1(x.kg,x.reps):x.reps/1000;if(v>bv){bv=v;best=x}mx=Math.max(mx,x.kg);vol+=x.kg*x.reps});
  var v=metric==='kg'?mx:metric==='vol'?vol:(best.kg>0?bv:NaN);
  if(!isFinite(v)||v<=0)return;
  out.push({d:d,ds:s.date,v:v,best:fmt(best.kg)+' × '+best.reps,name:s.name});
 });
 return out;
}
function niceTicks(min,max,n){
 if(min===max){min-=1;max+=1}
 var raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
 var step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
 var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
 for(var v=lo;v<=hi+1e-9;v+=step)t.push(Math.round(v*1000)/1000);
 return t;
}
function chartSVG(pts,sel,kind){
 var W=360,H=240,L=44,R=14,T=14,B=30;
 var ts=pts.map(function(p){return p.d.getTime()}),t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts);
 var vs=pts.map(function(p){return p.v});
 var ticks=niceTicks(Math.min.apply(null,vs),Math.max.apply(null,vs),4),y0=ticks[0],y1=ticks[ticks.length-1];
 function X(t){return t1===t0?L+(W-L-R)/2:L+(t-t0)/(t1-t0)*(W-L-R)}
 function Y(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)}
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de progression" data-chart="'+(kind||'ex')+'">';
 ticks.forEach(function(v){s+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="ch-t" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>'});
 var labs=t1===t0?[t0]:[0,1,2,3].map(function(k){return t0+(t1-t0)*k/3});
 labs.forEach(function(t,k){
  var a=labs.length===1?'middle':k===0?'start':k===labs.length-1?'end':'middle';
  s+='<text class="ch-t" x="'+X(t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+a+'">'+new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>';
 });
 var d='',bi=0;
 pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.d.getTime()).toFixed(1)+','+Y(p.v).toFixed(1);if(p.v>=pts[bi].v)bi=i});
 if(pts.length>1){
  s+='<path class="ch-area" d="'+d+'L'+X(t1).toFixed(1)+','+(H-B)+'L'+X(t0).toFixed(1)+','+(H-B)+'Z"/><path class="ch-line" d="'+d+'"/>';
 }
 if(kind==='bw')bi=-1;
 var sx=X(pts[sel].d.getTime());
 s+='<line class="ch-guide" x1="'+sx.toFixed(1)+'" x2="'+sx.toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'"/>';
 pts.forEach(function(p,i){
  var cls=i===sel?'ch-sel':i===bi?'ch-best':'ch-pt',r=i===sel?6:4;
  s+='<circle class="'+cls+'" cx="'+X(p.d.getTime()).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+r+'"/>';
 });
 return s+'</svg>';
}

   gCb=function(r){if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;res(gTok)}else rej(r||{error:'denied'})};
   gEb=function(e){rej(e||{error:'popup'})};
   try{gClient.requestAccessToken({prompt:prompt})}catch(e){rej(e)}
  });
 });
}
function gApi(url,init){
 init=init||{};init.headers=Object.assign({Authorization:'Bearer '+gTok},init.headers||{});
 return fetch(url,init).then(function(r){if(r.status===401)gTok=null;if(!r.ok)throw {error:'http'+r.status};return r});
}
function gFind(){
 return gApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='"+GFILE+"'")+'&fields=files(id,modifiedTime)')
  .then(function(r){return r.json()}).then(function(j){return (j.files||[])[0]||null});
}
function gRead(id){return gApi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media').then(function(r){return r.json()})}
function gPayload(){return JSON.stringify({app:'fitness-tracker',v:1,at:Date.now(),S:S,SESS:SESS})}
function gWrite(id,body){
 if(id)return gApi('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body}).then(function(r){return r.json()});
 var bd='ftb'+uid(),meta=JSON.stringify({name:GFILE,parents:['appDataFolder']});
 return gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
  body:'--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--'}).then(function(r){return r.json()});
}
function gDone(j){gSt.mod=j.modifiedTime;gSt.last=Date.now();gSt.hold=false;gSave();gNeed=false;gBusy=false;gErr='';gRefresh()}
function gAsk(r,f,why){
 var n=(r&&r.SESS&&r.SESS.length)||0;
 gSt.hold=true;gSave();
 if(ui.modal&&ui.modal.title==='Séance terminée'){ui.gwait=[r,f,why];gRefresh();return}
 ui.gpend={r:r,f:f};
 ui.modal={title:'Sauvegarde Drive trouvée',text:'Drive contient '+n+' séance'+(n>1?'s':'')+', enregistrée'+(n>1?'s':'')+' le '+new Date(f.modifiedTime).toLocaleDateString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'. Ce téléphone en contient '+SESS.length+'. '+(why==='manual'?'':'Choisis quelle version garder.'),
  btns:[{act:'gRestore',label:'Restaurer depuis Drive'},{act:'gOverwrite',label:'Écraser Drive avec ce téléphone',soft:true},{act:'closeModal',label:'Annuler',line:true}]};
 gRefresh();
}
var _closeM=A.closeModal;
A.closeModal=function(){_closeM();if(ui.gwait){var w=ui.gwait;ui.gwait=null;gAsk(w[0],w[1],w[2])}};
function gRun(interactive){
 if(gBusy||!GCID||GCID.indexOf('__')===0)return Promise.resolve();
 gBusy=true;gErr='';gRefresh();
 return gToken(interactive?'':'none').then(function(){
  if(interactive){gSt.on=true;gSave()}
  return gFind();
 }).then(function(f){
  if(f&&(!gSt.mod||f.modifiedTime!==gSt.mod)){
   return gRead(f.id).then(function(r){gBusy=false;gAsk(r,f,'');return 'ask'});
  }
  return gWrite(f&&f.id,gPayload()).then(function(j){gDone(j);return 'ok'});
 }).catch(function(e){
  gBusy=false;gErr=e&&e.error==='offline'?'hors ligne':'à reconnecter';gRefresh();return 'err';
 });
}
function gPull(){
 if(gBusy)return;gBusy=true;gErr='';gRefresh();
 gToken('').then(function(){gSt.on=true;gSave();return gFind()}).then(function(f){
  gBusy=false;if(!f){gRefresh();toast('Aucune sauvegarde sur Drive');return}
  return gRead(f.id).then(function(r){gAsk(r,f,'manual')});
 }).catch(function(e){gBusy=false;gErr=e&&e.error==='offline'?'hors ligne':'à reconnecter';gRefresh()});
}
function gTap(){
 if(!gOn()||gBusy||gSt.hold)return;
 var age=Date.now()-(gSt.last||0);
 if((gNeed&&age>1800000)||age>864e5)gRun(false);
}
app.addEventListener('click',gTap,true);
function gUI(){
 if(!GCID||GCID.indexOf('__')===0)return '';
 var pers='<p class="mute small" style="margin:8px 0 0">Stockage du téléphone protégé contre le nettoyage automatique : '+(gPers===1?'oui':gPers===0?'non (exporte régulièrement un fichier)':'inconnu')+'.</p>';
 if(!gOn())return '<div class="card" style="margin-top:10px"><div><b>Sauvegarde Google Drive</b><div class="mute small">Connecte ton compte Google une fois : l\'app sauvegarde ensuite toute seule dans un dossier caché de ton Drive. Rien n\'est partagé et l\'app ne voit pas le reste de ton Drive.</div></div><button class="btn" data-act="gConnect">Se connecter avec Google</button></div>'+pers;
 var st=gBusy?'Sauvegarde en cours…':gSt.hold?'⚠ Choix en attente : appuie sur « Sauvegarder maintenant ».':gErr?'⚠ '+gErr+'. Appuie sur « Sauvegarder maintenant » pour te reconnecter.':'Dernière sauvegarde : '+(gSt.last?gAgo(gSt.last):'aucune')+'. Automatique après chaque séance.';
 return '<div class="card" style="margin-top:10px"><div><b>Sauvegarde Google Drive</b><div class="mute small">'+st+'</div></div><div class="row2"><button class="btn soft" data-act="gNow">Sauvegarder maintenant</button><button class="btn soft" data-act="gPull">Restaurer</button></div><button class="btn line" data-act="gOff">Se déconnecter</button></div>'+pers;
}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
initDb();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script>
</body>
</html>
